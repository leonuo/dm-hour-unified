[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-hour-unified"
version = "0.2.0"
description = "Local-first campaign engine with browser and optional private API transports"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
private-api = ["instagrapi>=2.2"]

[project.scripts]
dmhour = "dmhour.__main__:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
dmhour = ["static/*"]
